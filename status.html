<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <meta name="description" content="Newsletter Status">

    <link rel="stylesheet" href="css/style.css">
    <script src="js/status.js" defer></script>

    <link rel="preload" href="Images/bg.jpg" as="image" fetchpriority="high">
    <link rel="icon" href="Images/favicon.ico">

    <title>Status – Matthias Schott</title>
</head>

<body class="landing">

<!-- TOP BAR -->
<div class="top-bar">
    <div class="title">
        NEWSLETTER
        <span>Matthias Schott</span>
    </div>

    <button class="close-button" id="closeButton">✕</button>
</div>

<!-- STATUS CARD -->
<div class="newsletter-card status-card">

    <!-- CARD CONTENT -->
    <div class="card-content">

        <!-- ICON -->
        <div class="newsletter-icon">
            <img id="githubIcon" src="Images/github.png" alt="GitHub Logo">
        </div>

        <!-- STATUS HEADER -->
        <div class="status-header">
            <span id="icon" class="status-icon"></span>
            <h1 id="title" class="status-title"></h1>
        </div>

        <!-- STATUS TEXT -->
        <p id="status-message"></p>

    </div>

    <!-- CARD FOOTER -->
    <div class="card-footer">
        <div class="git-legal-note">
            GitHub ist Marke der GitHub, Inc.
        </div>
    </div>

</div>

<!-- FOOTER -->
<footer class="bottom-bar">

    <div></div>

    <div class="footer-links">
        <a href="impressum.html">Impressum</a>
        <span class="divider"></span>
        <a href="datenschutz.html">Datenschutz</a>
    </div>

    <div class="footer-right">© 2026 Matthias Schott</div>

</footer>

</body>
</html>
